<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pizza AR Explosion</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        #ar-container { width: 100vw; height: 100vh; position: relative; }
        #hint { position: absolute; bottom: 20px; width: 100%; text-align: center; color: white; font-family: sans-serif; pointer-events: none; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
</head>
<body>
    <div id="ar-container"></div>
    <div id="hint">Tap screen to explode/reassemble</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { MindARThree } from 'mindar-image-three';

        // --- SETTINGS ---
        const MODEL_SCALE = 1.5; // 3x larger than your previous 0.5 setting
        const EXPLODE_DISTANCE = 0.5; // How far pieces fly (kept small so they stay on screen)
        const LAYER_MODE = false; // Set to TRUE if you want them to explode vertically like layers

        // Initialize MindAR with smoothing
        const mindarThree = new MindARThree({
            container: document.querySelector("#ar-container"),
            imageTargetSrc: './targets.mind', 
            filterMinCF: 0.0001, 
            filterBeta: 0.001,   
        });

        const { renderer, scene, camera } = mindarThree;

        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        scene.add(light);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(0, 10, 5);
        scene.add(dirLight);

        const anchor = mindarThree.addAnchor(0);
        
        let pizzaModel = null;
        let isAnimating = false;
        let animationProgress = 0;
        let meshesToAnimate = []; 

        const loader = new GLTFLoader();
        loader.load('./pizza-optimize-v1.glb', (gltf) => {
            pizzaModel = gltf.scene;
            pizzaModel.scale.set(MODEL_SCALE, MODEL_SCALE, MODEL_SCALE); 
            anchor.group.add(pizzaModel);
            
            // 1. Calculate the TRUE CENTER of the whole pizza
            const box = new THREE.Box3().setFromObject(pizzaModel);
            const center = box.getCenter(new THREE.Vector3());

            // 2. Setup the pieces
            pizzaModel.traverse((child) => {
                if (child.isMesh) {
                    child.userData.originalPosition = child.position.clone();
                    
                    if (LAYER_MODE) {
                        // Explode straight UP
                        child.userData.explodeDirection = new THREE.Vector3(0, 1, 0);
                    } else {
                        // Explode outward from the TRUE CENTER
                        let dir = child.position.clone().sub(center);
                        if(dir.length() < 0.01) { 
                            // If the piece is exactly at the center, give it a random push
                            dir.set(Math.random() - 0.5, 0, Math.random() - 0.5);
                        }
                        dir.normalize();
                        child.userData.explodeDirection = dir;
                    }
                    meshesToAnimate.push(child);
                }
            });
        });

        // --- The Animation Logic ---
        function animatePizza() {
            if (!pizzaModel) return;

            if (isAnimating && animationProgress < 1) animationProgress += 0.02;
            if (!isAnimating && animationProgress > 0) animationProgress -= 0.02;

            const easeProgress = Math.sin((animationProgress * Math.PI) / 2); 

            meshesToAnimate.forEach((child, index) => {
                const originalPos = child.userData.originalPosition;
                const dir = child.userData.explodeDirection;
                
                // If in Layer Mode, we stagger the heights so they don't overlap
                let currentDistance = EXPLODE_DISTANCE;
                if (LAYER_MODE) {
                    currentDistance = EXPLODE_DISTANCE + (index * 0.15); 
                }
                
                child.position.x = originalPos.x + (dir.x * currentDistance * easeProgress);
                child.position.y = originalPos.y + (dir.y * currentDistance * easeProgress);
                child.position.z = originalPos.z + (dir.z * currentDistance * easeProgress);
            });
        }

        // --- AR Events ---
        anchor.onTargetFound = () => {
            setTimeout(() => { isAnimating = true; }, 1000);
            setTimeout(() => { isAnimating = false; }, 4000);
        };

        anchor.onTargetLost = () => {
            isAnimating = false;
        };

        // Tap to Trigger
        window.addEventListener('click', () => {
            isAnimating = !isAnimating;
        });

        mindarThree.start();
        renderer.setAnimationLoop(() => {
            animatePizza(); 
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
