<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pizza AR Explosion</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        #ar-container { width: 100vw; height: 100vh; position: relative; }
    </style>
    
    <!-- Use an import map to load Three.js and its addons as modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
</head>
<body>
    <div id="ar-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { MindARThree } from 'mindar-image-three';

        // Initialize MindAR
        const mindarThree = new MindARThree({
            container: document.querySelector("#ar-container"),
            imageTargetSrc: './targets.mind', // Make sure this matches your file name
        });

        const { renderer, scene, camera } = mindarThree;

        // Add lighting so the pizza looks good
        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        scene.add(light);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(0, 10, 5);
        scene.add(dirLight);

        // Setup the anchor (where the model will attach)
        const anchor = mindarThree.addAnchor(0);
        
        let pizzaModel = null;
        let isAnimating = false;
        let animationProgress = 0;

        // Load the 3D Model
        const loader = new GLTFLoader();
        loader.load('./pizza-optimize-v1.glb', (gltf) => {
            pizzaModel = gltf.scene;
            
            // Scale the model down if it's too big for the image
            pizzaModel.scale.set(0.5, 0.5, 0.5); 
            
            // Add the model to the AR anchor
            anchor.group.add(pizzaModel);
            
            // Store the original position and calculate an explosion direction for each slice
            pizzaModel.children.forEach(child => {
                child.userData.originalPosition = child.position.clone();
                // Create an outward vector based on where the piece is relative to the center
                child.userData.explodeDirection = child.position.clone().normalize(); 
            });
        });

        // --- The Animation Logic ---
        function animatePizza() {
            if (!pizzaModel) return;

            // Smoothly increase or decrease the animation progress
            if (isAnimating && animationProgress < 1) animationProgress += 0.02;
            if (!isAnimating && animationProgress > 0) animationProgress -= 0.02;

            // Use an easing function for a smoother "pop" effect
            const easeProgress = Math.sin((animationProgress * Math.PI) / 2); 

            pizzaModel.children.forEach(child => {
                const originalPos = child.userData.originalPosition;
                const dir = child.userData.explodeDirection;
                
                // Move the piece outward based on progress
                const distance = 2.0; // How far the slices fly away
                child.position.x = originalPos.x + (dir.x * distance * easeProgress);
                child.position.y = originalPos.y + (dir.y * distance * easeProgress);
                child.position.z = originalPos.z + (dir.z * distance * easeProgress);
            });
        }

        // --- AR Events ---
        anchor.onTargetFound = () => {
            console.log("Target found! Starting explosion...");
            // Wait 1 second after finding the image, then explode
            setTimeout(() => { isAnimating = true; }, 1000);
            
            // Wait 4 seconds, then put it back together
            setTimeout(() => { isAnimating = false; }, 4000);
        };

        anchor.onTargetLost = () => {
            // Reset when the camera looks away
            isAnimating = false;
            animationProgress = 0;
        };

        // Start the AR experience
        mindarThree.start();
        renderer.setAnimationLoop(() => {
            animatePizza(); // Run our custom animation
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
