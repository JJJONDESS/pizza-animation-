<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pizza AR Explosion</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        #ar-container { width: 100vw; height: 100vh; position: relative; }
        #hint { position: absolute; bottom: 20px; width: 100%; text-align: center; color: white; font-family: sans-serif; pointer-events: none; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
</head>
<body>
    <div id="ar-container"></div>
    <div id="hint">Tap screen to explode/reassemble</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { MindARThree } from 'mindar-image-three';

        // Initialize MindAR with smoothing
        const mindarThree = new MindARThree({
            container: document.querySelector("#ar-container"),
            imageTargetSrc: './targets.mind', 
            filterMinCF: 0.0001, 
            filterBeta: 0.001,   
        });

        const { renderer, scene, camera } = mindarThree;

        scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(0, 10, 5);
        scene.add(dirLight);

        const anchor = mindarThree.addAnchor(0);
        
        let pizzaModel = null;
        let isAnimating = false;
        let animationProgress = 0;
        let meshesToAnimate = []; 
        
        // --- SETTINGS ---
        const EXPLODE_DISTANCE = 0.8; // How far pieces fly (relative to the pizza's size)

        const loader = new GLTFLoader();
        loader.load('./pizza-optimize-v1.glb', (gltf) => {
            pizzaModel = gltf.scene;
            
            // 1. Calculate the true size and center of your scanned pizza
            const box = new THREE.Box3().setFromObject(pizzaModel);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            // 2. Shift the model so its exact center is at (0,0,0)
            pizzaModel.position.sub(center);

            // 3. Auto-scale the model to fit the marker perfectly (max dimension = 1)
            const maxDim = Math.max(size.x, size.y, size.z);
            const scaleFactor = 1.0 / maxDim; 
            pizzaModel.scale.setScalar(scaleFactor * 2.0); // Change '2.0' to make the pizza bigger/smaller overall

            anchor.group.add(pizzaModel);
            
            // 4. Setup the meshes for explosion
            pizzaModel.traverse((child) => {
                if (child.isMesh) {
                    child.userData.originalPosition = child.position.clone();
                    
                    // Calculate direction outward from the TRUE center (0,0,0)
                    let dir = child.position.clone();
                    if (dir.length() < 0.01) {
                        dir.set(0, 1, 0); // Fallback just in case a piece is exactly at center
                    }
                    dir.normalize();
                    child.userData.explodeDirection = dir;
                    
                    meshesToAnimate.push(child);
                }
            });
        });

        // --- The Animation Logic ---
        function animatePizza() {
            if (!pizzaModel) return;

            if (isAnimating && animationProgress < 1) animationProgress += 0.03;
            if (!isAnimating && animationProgress > 0) animationProgress -= 0.03;

            const easeProgress = Math.sin((animationProgress * Math.PI) / 2); 

            meshesToAnimate.forEach(child => {
                const originalPos = child.userData.originalPosition;
                const dir = child.userData.explodeDirection;
                
                // Move the piece outward
                child.position.x = originalPos.x + (dir.x * EXPLODE_DISTANCE * easeProgress);
                child.position.y = originalPos.y + (dir.y * EXPLODE_DISTANCE * easeProgress);
                child.position.z = originalPos.z + (dir.z * EXPLODE_DISTANCE * easeProgress);
            });
        }

        // --- AR Events ---
        anchor.onTargetFound = () => {
            setTimeout(() => { isAnimating = true; }, 1000);
            setTimeout(() => { isAnimating = false; }, 4000);
        };

        anchor.onTargetLost = () => {
            isAnimating = false;
        };

        // Tap to Trigger
        window.addEventListener('click', () => {
            isAnimating = !isAnimating;
        });

        mindarThree.start();
        renderer.setAnimationLoop(() => {
            animatePizza(); 
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
