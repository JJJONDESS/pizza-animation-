<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pizza AR Explosion</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        #ar-container { width: 100vw; height: 100vh; position: relative; }
        /* Optional: A little hint for the user */
        #hint { position: absolute; bottom: 20px; width: 100%; text-align: center; color: white; font-family: sans-serif; pointer-events: none; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
</head>
<body>
    <div id="ar-container"></div>
    <div id="hint">Tap screen to explode/reassemble</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { MindARThree } from 'mindar-image-three';

        // Initialize MindAR with SMOOTHING enabled to fix the shaking
        const mindarThree = new MindARThree({
            container: document.querySelector("#ar-container"),
            imageTargetSrc: './targets.mind', 
            filterMinCF: 0.0001, // Smoothing filter (lower = smoother, but more lag)
            filterBeta: 0.001,   // Adaptive filter
        });

        const { renderer, scene, camera } = mindarThree;

        // Add lighting
        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        scene.add(light);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(0, 10, 5);
        scene.add(dirLight);

        const anchor = mindarThree.addAnchor(0);
        
        let pizzaModel = null;
        let isAnimating = false;
        let animationProgress = 0;
        let meshesToAnimate = []; // We will store the actual slices here

        const loader = new GLTFLoader();
        loader.load('./pizza-optimize-v1.glb', (gltf) => {
            pizzaModel = gltf.scene;
            pizzaModel.scale.set(0.5, 0.5, 0.5); 
            anchor.group.add(pizzaModel);
            
            // --- THE FIX: Use traverse to find the actual meshes ---
            pizzaModel.traverse((child) => {
                if (child.isMesh) {
                    // Store the original position of the slice
                    child.userData.originalPosition = child.position.clone();
                    
                    // Calculate the direction outward from the center (0,0,0)
                    // If the original position is 0,0,0 (common in scans), we give it a random direction
                    let dir = child.position.clone();
                    if(dir.length() === 0) {
                        dir.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
                    } else {
                        dir.normalize();
                    }
                    child.userData.explodeDirection = dir;
                    
                    meshesToAnimate.push(child);
                }
            });
            console.log("Found meshes to animate:", meshesToAnimate.length);
        });

        // --- The Animation Logic ---
        function animatePizza() {
            if (!pizzaModel) return;

            if (isAnimating && animationProgress < 1) animationProgress += 0.03;
            if (!isAnimating && animationProgress > 0) animationProgress -= 0.03;

            const easeProgress = Math.sin((animationProgress * Math.PI) / 2); 

            // Animate every single slice we found
            meshesToAnimate.forEach(child => {
                const originalPos = child.userData.originalPosition;
                const dir = child.userData.explodeDirection;
                
                const distance = 2.0; // How far the slices fly away
                child.position.x = originalPos.x + (dir.x * distance * easeProgress);
                child.position.y = originalPos.y + (dir.y * distance * easeProgress);
                child.position.z = originalPos.z + (dir.z * distance * easeProgress);
            });
        }

        // --- AR Events ---
        anchor.onTargetFound = () => {
            // Start exploded after 1 second
            setTimeout(() => { isAnimating = true; }, 1000);
            // Reassemble after 4 seconds
            setTimeout(() => { isAnimating = false; }, 4000);
        };

        anchor.onTargetLost = () => {
            // Don't reset progress to 0 immediately, or it will snap. Let it reassemble smoothly.
            isAnimating = false;
        };

        // --- Tap to Trigger (Fallback) ---
        window.addEventListener('click', () => {
            isAnimating = !isAnimating;
        });

        // Start the AR experience
        mindarThree.start();
        renderer.setAnimationLoop(() => {
            animatePizza(); 
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
